name: Publish VS Code Extension to Open VSX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (package and verify without publishing)'
        required: true
        type: boolean
        default: false

jobs:
  publish:
    name: Package and Publish Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm run build

      - name: Run test suite
        run: pnpm run test

      - name: Package extension (.vsix)
        working-directory: apps/vscode-extension
        run: |
          npx @vscode/vsce package --no-dependencies --out context-broker-vscode.vsix
          ls -lh context-broker-vscode.vsix

      - name: Publish to Open VSX Registry
        if: ${{ github.event.inputs.dry_run != 'true' && env.OVSX_PAT != '' }}
        working-directory: apps/vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish context-broker-vscode.vsix --pat "$OVSX_PAT"

      - name: Publish to VS Code Marketplace (Optional)
        if: ${{ github.event.inputs.dry_run != 'true' && env.VSCE_PAT != '' }}
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce publish --packagePath context-broker-vscode.vsix --pat "$VSCE_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: apps/vscode-extension/context-broker-vscode.vsix
          generate_release_notes: true
